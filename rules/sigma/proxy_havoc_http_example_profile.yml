title: Havoc C2 HTTP Request (shipped example profile)
id: e1f2bf20-99bc-4774-88ca-cd59024338dc
status: experimental
description: 'Havoc ships example HTTP profiles and the operator selects one (there is no single fixed default). Matches a Havoc shipped example profile request: the Chrome 96 / Windows 7 User-Agent from profiles/http_smb.yaotl, a POST, and the literal Content-Type ''*/*'' observed in lab traffic. The ''*/*'' mechanism is not established (it may come from the agent or the HTTP stack). cs-content-type is a c2parser-provided field. A profile match is not confirmed framework ownership.'
references:
    - https://github.com/HavocFramework/Havoc/blob/c84f7755a8b1c0f737576bdd3a0e982a296012f1/profiles/http_smb.yaotl#L34
    - https://github.com/HavocFramework/Havoc/blob/c84f7755a8b1c0f737576bdd3a0e982a296012f1/WIKI.MD
author: c2parser
date: 2026-10-14
tags:
    - attack.command-and-control
    - attack.t1071
logsource:
    category: proxy
detection:
    selection:
        cs-method: 'POST'
        c-useragent: 'Mozilla/5.0 (Windows NT 6.1; WOW64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/96.0.4664.110 Safari/537.36'
        cs-content-type: '\*/\*'  # escaped: a literal */*, not a wildcard
    condition: selection
falsepositives:
    - Unlikely
level: high

title: Sliver DNS C2 Query Name Shape
id: 50995159-1149-4d68-9fc9-e1a71e0334ac
status: experimental
description: 'Sliver DNS C2 names observed by Luise (2024): first label starts with the constant ''baak'' framing prefix followed by Sliver''s base32 alphabet. Prefix varies by message type; prefer c2parser''s positional_randomness signal for generality.'
references:
    - https://docs.mythic-c2.net/
    - https://github.com/MythicC2Profiles
author: c2parser
date: 2026-10-14
tags:
    - attack.command-and-control
    - attack.t1071
logsource:
    category: dns
detection:
    selection:
        query|re: '^baak[a-z0-9]{8,}\.'
    condition: selection
falsepositives:
    - Unlikely
level: medium

# v10a 1.3 gate: a synthetic 20-host, 6-hour benign set (models only;
# regression evidence for the eval plumbing, never thresholds).
name: benign-20host-6h
seed: 1003
streams:
  - {label: benign, shape: benign=poisson, transport: https-new-conn, server: 198.51.100.83, name: mail.example.org, topology: {fleet: {base: 10.70.0.1, n: 20}}, timing: {model: poisson, sleep: 90, events: 200}, content: {poll: {min: 400}, resp: {dist: uniform, min: 200, max: 3000}}}
  - {label: benign, shape: benign=browsing, transport: https-new-conn, server: 198.51.100.81, name: www.example, topology: {fleet: {base: 10.70.0.1, n: 20}}, timing: {model: browsing, sleep: 600, events: 30}, content: {poll: {dist: uniform, min: 300, max: 1200}, resp: {dist: uniform, min: 2000, max: 60000}}}
  - {label: benign, shape: benign=gamma0.5, transport: https-new-conn, server: 198.51.100.82, name: api.example.org, topology: {fleet: {base: 10.70.0.1, n: 20}}, timing: {model: gamma, shape: 0.5, sleep: 120, events: 150}, content: {poll: {dist: uniform, min: 300, max: 600}, resp: {dist: uniform, min: 200, max: 5000}}}
  - {label: benign, shape: benign=intune, transport: https-new-conn, server: 198.51.100.85, name: mdm.example.net, topology: {fleet: {base: 10.70.0.1, n: 20}}, timing: {model: intune, events: 9}, content: {poll: {min: 900}, resp: {min: 1500}}}
  - {label: benign, shape: benign=chrome-updater, transport: https-new-conn, server: 198.51.100.86, name: update.example.com, topology: {fleet: {base: 10.70.0.1, n: 20}}, timing: {model: chrome, events: 1}, content: {poll: {min: 700}, resp: {min: 600}}}
  - {label: benign, shape: benign=prometheus, transport: http-keepalive, server: 10.70.0.200, port: 9100, name: "10.70.0.200:9100", topology: {clients: [10.70.0.20]}, timing: {model: prometheus, events: 1300}, content: {uri: /metrics, headers: ["User-Agent: Prometheus/2.45.0", "Accept: text/plain"], encoding: text, resp: {dist: uniform, min: 20000, max: 24000}}}

# Phase 0.1 gate: single-client benign scheduler model (gpo); the
# scheduler-shape annotation applies the timing-only cap (< 0.4).
name: gate-scheduler-gpo
seed: 131
streams:
  - label: benign
    shape: scheduler=gpo
    transport: http-keepalive
    server: 198.51.100.62
    name: mgmt.example
    topology: {clients: [10.30.0.5]}
    timing: {model: gpo, events: 30}
    content:
      uri: /checkin
      headers: ["User-Agent: ManagementAgent/4.2", "Accept: */*", "Accept-Encoding: gzip", "Accept-Language: en-US"]
expect:
  - {engine: v1, server: 198.51.100.62, max: 0.39}
  - {engine: v2, server: 198.51.100.62, max: 0.39}

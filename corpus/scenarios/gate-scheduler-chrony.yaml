# Phase 0.1 gate: single-client benign scheduler model (chrony); the
# scheduler-shape annotation applies the timing-only cap (< 0.4).
name: gate-scheduler-chrony
seed: 133
streams:
  - label: benign
    shape: scheduler=chrony
    transport: http-keepalive
    server: 198.51.100.64
    name: mgmt.example
    topology: {clients: [10.30.0.5]}
    timing: {model: chrony, events: 40}
    content:
      uri: /checkin
      headers: ["User-Agent: ManagementAgent/4.2", "Accept: */*", "Accept-Encoding: gzip", "Accept-Language: en-US"]
expect:
  - {engine: v1, server: 198.51.100.64, max: 0.39}
  - {engine: v2, server: 198.51.100.64, max: 0.39}
